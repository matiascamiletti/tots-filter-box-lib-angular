<div>
	<button mat-stroked-button class="btn" [matMenuTriggerFor]="conditionalFilter" #menuConditional="matMenuTrigger" style="width: 100%;">
		@if (item.conditional == 0) {
			<span>Is</span>
		}
		<mat-icon>expand_more</mat-icon>
	</button>

	<mat-menu #conditionalFilter="matMenu">
		<button mat-menu-item (click)="item.conditional = 0; onChange(); $event.stopPropagation(); menuConditional.closeMenu()">
			Is
		</button>
	</mat-menu>
  </div>
