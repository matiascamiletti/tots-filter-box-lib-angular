<div class="tots-search-menu-input-container" (click)="$event.stopPropagation();">
    <mat-form-field class="tots-search-menu-input">
        <input matInput type="text" [formControl]="input" placeholder="Search">
    </mat-form-field>
    <div class="tots-search-menu-options-container">
		@for (option of config.selecteds; track $index) {
			<div class="tots-search-menu-option-selected" (click)="onClickRemoveSelected(option)">
				<span>{{option.label}}</span>
				<mat-icon>close</mat-icon>
			</div>
		}

		@if (config.allowMultiple && config.selecteds.length) {
        		<hr>
		}

		@if (filteredOptions.length) {
			<div class="tots-search-menu-empty">
				<span>No results found, please try with other search terms</span>
			</div>
		}

		@for (option of filteredOptions; track $index) {
			<div class="tots-search-menu-option" (click)="onSelectOption(option)">
				<span>{{option.label}}</span>
			</div>
		}
        
	</div>
</div>
